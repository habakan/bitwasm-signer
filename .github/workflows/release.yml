name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-wasm
          path: build

      # Later CI steps ran after the bytes were checked; what ships has to still be what the tag commits to
      - name: SHA256SUMS
        run: |
          sha256sum -c checksums.txt
          cd build && sha256sum parser.wasm signer.wasm > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/parser.wasm

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/signer.wasm

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "Built with the pinned toolchain (wasi-sdk 34.0, binaryen 132)."
            echo "Both modules passed the CI test workflow before release."
            echo
            echo '```'
            cat build/SHA256SUMS
            echo '```'
            echo
            echo "Reproduce it yourself: check out this tag and build with the pinned toolchain."
            echo "The same bytes come out on macOS arm64 and Linux x86_64."
            echo
            echo "Provenance: \`gh attestation verify <module> --repo $REPO --cert-identity https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG --deny-self-hosted-runners\`"
            echo
            echo "A detached PGP signature over SHA256SUMS is attached when the maintainer signs the release."
          } > notes.md
          gh release create "$TAG" build/parser.wasm build/signer.wasm build/SHA256SUMS \
            --repo "$REPO" --title "$TAG" --notes-file notes.md
